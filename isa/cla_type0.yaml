# CLA Type-0 komut tablosu
# Kaynak: SPRUI10A Bolum 10.6.3 (s.589-703)
# tools/extract_isa.py tarafindan uretildi - elle duzenlerken
# duzeltmeyi ELLE_DUZELTME sozlugune de islemeyi unutma.
#
# mask/match: 32-bit word (MSW bit31-16, LSW bit15-0).
#   (word & mask) == match  ->  bu komut
# fields: operand harfi -> kapladigi bit konumlari
#
# NOT: 'uygulandi mi' bilgisi burada TUTULMAZ - bu dosya uretiliyor,
# her uretimde silinirdi. O bilgi Python tarafindaki dagitim
# sozlugunde durur (cla_core.py): mnemonic sozlukte varsa uygulanmistir.
#
# aliases: ayni opcode'un kilavuzda gecen diger yazilisi (s.591).
#
# TABLODA OLMAYAN 2 KOMUT (kasitli):
#   MMOVF32 MRa, #32F   (s.660)  ve  MMOVI32 MRa, #32FHex (s.663)
#   Bunlarin kendi opcode'u YOK. Kilavuz: 'This instruction is an alias
#   for MMOVIZ and MMOVXI'. Assembler bunlari iki komuta acar.
#   Faz 2'de assembler'a sahte komut (pseudo-instruction) olarak eklenecek.
#
# COZULMEMIS CAKISMA (cakisma testi bunu bulur):
#     MADD32 MRa,MRb,MRc  <->  MF32TOUI16R MRa,MRb   ikisi de MSW 0x7EC0
#     GERCEK CELISKI. MF32TOUI16R komsulariyla dizi olusturuyor
#     (0x7E80 MI16TOF32, 0x7EA0 MF32TOUI16, 0x7EC0 ?, 0x7EE0 MUI16TOF32),
#     MADD32 ise kardesi MSUB32'nin (0x7CE0) yaninda olmali. Supheli olan
#     MADD32. cl2000 ile derleyip dogrulanacak. COZULMEDI.

